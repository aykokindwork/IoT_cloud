services:
  kafka:
    image: bitnami/kafka:3.7.0
    container_name: iot_kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@127.0.0.1:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://127.0.0.1:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      # ВНИМАНИЕ: Сюда впиши IP-адрес твоего текущего компа (например, 192.168.1.50)
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://172.20.112.1:9092